[project]
name = "simple-or-agent"
version = "0.1.2"
description = ""
authors = [
    {name = "eugeny",email = "esshka@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = [
    "requests>=2.31",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
    "ddgs>=1.0",
    "beautifulsoup4>=4.12",
    "instructor>=1.3",
    "openai>=1.30",
    "pydantic>=2.7",
    "leann (>=0.3.4,<0.4.0)",
]

[tool.poetry]
packages = [{include = "src/simple_or_agent"}]
package-mode = true


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
